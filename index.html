<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <meta name="description" content="CrisisWatch demonstrates asynchronous data loading, validation, error handling, and responsive UI rendering with vanilla JavaScript." />
    <title>CRISISWATCH</title>
  </head>

  <body>
    <header>
      <div class="head-container">
        <h1>CRISISWATCH</h1>
        <div class="head-subcontainer">
          <p class="subcontainer-one"></p>
          <p class="lastUpdateText" id="latestUpdateNote">Last updated: --</p>
        </div>
      </div>
    </header>

    <main>
      <div>
        <div class="service-header">
          <h2>Service Status</h2>
          <div class="service-subheader">
            <img src="./images/system-no-data.svg" alt="" id="statusImage" />
            <div>
              <p class="service-text" id="serviceText"></p>
              <p class="systemHealth-text" id="systemText"></p>
            </div>
          </div>
        </div>
        <div class="overlay-grid">
          <div class="cards">
            <img src="./images/all-services.svg" alt="" />
            <div class="cardText">
              <span>All Services</span>
              <p id="totalServices"></p>
            </div>
          </div>

          <div class="cards">
            <img src="./images/operational.svg" alt="" />
            <div class="cardText green">
              <span>Operational</span>
              <p id="operationalServices"></p>
            </div>
          </div>

          <div class="cards">
            <img src="./images/degraded.svg" alt="" />
            <div class="cardText orange">
              <span>Degraded</span>
              <p id="degradedServices"></p>
            </div>
          </div>

          <div class="cards">
            <img src="./images/outage.svg" alt="" />
            <div class="cardText red">
              <span>Outage</span>
              <p id="outageServices"></p>
            </div>
          </div>
        </div>
      </div>
      <div class="search-area">
        <div>
          <label for="searchInput" class="sr-only">Search</label>
          <input type="text" id="searchInput" placeholder="Search services" />
        </div>
        <fieldset class="segment-area">
          <legend class="sr-only">Filter by Status</legend>
          <label class="segment">
            <input type="radio" name="status" value="all" checked />
            <span class="segment-content">all</span>
          </label>
          <label class="segment">
            <input type="radio" name="status" value="operational" />
            <span class="segment-content"><img src="./images/operational.svg" alt="" />operational </span>
          </label>
          <label class="segment">
            <input type="radio" name="status" value="degraded" />
            <span class="segment-content"><img src="./images/degraded.svg" alt="" />degraded </span>
          </label>
          <label class="segment">
            <input type="radio" name="status" value="outage" />
            <span class="segment-content"><img src="./images/outage.svg" alt="" />outage </span>
          </label>
        </fieldset>
      </div>

      <div id="loadingState" class="loading-state" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p>Loading services...</p>
      </div>

      <div id="errorState" class="loading-state" role="alert" hidden>
        <span aria-hidden="true"></span>
        <p>An error occurred. Try again.</p>
        <button type="button" class="tryAgainBtn" id="tryAgainButton">Try again</button>
      </div>

      <div id="searchResults" class="search-result-state" aria-live="polite" hidden>
        <span aria-hidden="true"></span>
        <p id="searchResultMessage"></p>
      </div>

      <div id="tableWrapper" class="overflow" tabindex="0" role="region" aria-label="Service overview">
        <table id="overviewTable" class="overviewTable">
          <caption class="sr-only">
            Service overview Table
          </caption>
          <thead>
            <tr>
              <th scope="col">Service</th>
              <th scope="col">Status</th>
              <th scope="col">Response Time</th>
              <th scope="col">Performance</th>
              <th scope="col">Last updated</th>
            </tr>
          </thead>
          <tbody id="serviceTable"></tbody>
        </table>
      </div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
